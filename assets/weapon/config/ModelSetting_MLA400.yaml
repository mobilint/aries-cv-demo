pipeline_config_defaults:
  num_classes: 2
  labels:
    - gun
    - knife
  conf_threshold: 0.25
  iou_threshold: 0.45
  bbox_thickness: 2
  decode_bbox: true
  draw_label_text: true
  draw_score_text: true
  draw_detection_border: true

